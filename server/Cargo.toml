[package]
name = "flimmer"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# Standalone server for browser access (no stream sniffer). The desktop app is `Flimmer.exe`.
[[bin]]
name = "flimmer-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
url = "2"
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dns", "async"] }
tokio-util = { version = "0.7.20", features = ["io"] }
base64 = "0.23.1"
regex = "1.13.2"
rand = "0.10.4"
bytes = "1.12.2"
sha2 = "0.10"
hmac = "0.12"
if-addrs = "0.15.0"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }

