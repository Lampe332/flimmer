[package]
name = "flimmer-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[[bin]]
name = "Flimmer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flimmer = { path = "../server" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
